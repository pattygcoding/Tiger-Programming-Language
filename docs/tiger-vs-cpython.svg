<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <title>Tiger vs CPython: how many times faster on each part of one workload</title>
  <style>
    .n { fill: #e2e8f0; font-size: 28px; }
    .p { fill: #f4fffb; font-size: 30px; font-weight: 700; }
    .m { fill: #94a3b8; font-size: 22px; text-anchor: end; }
    .t { fill: #1b2536; }
    .a { fill: #64748b; font-size: 18px; text-anchor: middle; }
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a8a5e"/>
      <stop offset="1" stop-color="#4fdca3"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="#0b1120"/>

  <!-- headline -->
  <text x="64" y="112" font-size="58" font-weight="700" fill="#f8fafc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Tiger vs CPython</text>
  <text x="1016" y="112" font-size="34" font-weight="700" fill="#4fdca3" text-anchor="end">Every section</text>
  <text x="1016" y="146" font-size="22" fill="#94a3b8" text-anchor="end">past the CPython line</text>
  <text x="64" y="166" font-size="25" fill="#94a3b8">One fixed workload: a loop, lists, dicts, strings,</text>
  <text x="64" y="200" font-size="25" fill="#94a3b8">methods, recursion and calls. Both sides run in</text>
  <text x="64" y="234" font-size="25" fill="#94a3b8">process, each program's own compile removed.</text>

  <!-- legend -->
  <rect x="64" y="270" width="24" height="24" rx="6" fill="url(#g)"/>
  <text x="100" y="289" font-size="21" fill="#e2e8f0">Tiger's speed</text>
  <line x1="290" y1="282" x2="322" y2="282" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="334" y="289" font-size="21" fill="#e2e8f0">CPython (1.00x)</text>

  <!-- column headers -->
  <text x="64" y="372" font-size="17" fill="#64748b">SECTION</text>
  <text x="230" y="372" font-size="20" fill="#94a3b8">Speed against CPython (1.00x is the same speed)</text>
  <text x="1016" y="372" font-size="17" fill="#64748b" text-anchor="end">TIGER / CPYTHON, MS</text>

  <!-- gridlines -->
  <line x1="570" y1="395" x2="570" y2="1025" stroke="#1f2937"/>
  <line x1="684" y1="395" x2="684" y2="1025" stroke="#1f2937"/>
  <line x1="797" y1="395" x2="797" y2="1025" stroke="#1f2937"/>

  <!-- strings 2.60x -->
  <text class="n" x="64" y="434">strings</text>
  <rect class="t" x="230" y="407" width="590" height="34" rx="8"/>
  <rect x="230" y="407" width="590" height="34" rx="8" fill="url(#g)"/>
  <text class="p" x="248" y="435">2.60x</text>
  <text class="m" x="1016" y="432">0.005 / 0.013</text>

  <!-- calls 1.42x -->
  <text class="n" x="64" y="515">calls</text>
  <rect class="t" x="230" y="488" width="590" height="34" rx="8"/>
  <rect x="230" y="488" width="322" height="34" rx="8" fill="url(#g)"/>
  <text class="p" x="248" y="516">1.42x</text>
  <text class="m" x="1016" y="513">1.709 / 2.428</text>

  <!-- loop 1.41x -->
  <text class="n" x="64" y="596">loop</text>
  <rect class="t" x="230" y="569" width="590" height="34" rx="8"/>
  <rect x="230" y="569" width="320" height="34" rx="8" fill="url(#g)"/>
  <text class="p" x="248" y="597">1.41x</text>
  <text class="m" x="1016" y="594">0.022 / 0.031</text>

  <!-- lists 1.25x -->
  <text class="n" x="64" y="677">lists</text>
  <rect class="t" x="230" y="650" width="590" height="34" rx="8"/>
  <rect x="230" y="650" width="284" height="34" rx="8" fill="url(#g)"/>
  <text class="p" x="248" y="678">1.25x</text>
  <text class="m" x="1016" y="675">0.060 / 0.075</text>
  <!-- methods 1.17x -->
  <text class="n" x="64" y="758">methods</text>
  <rect class="t" x="230" y="731" width="590" height="34" rx="8"/>
  <rect x="230" y="731" width="265" height="34" rx="8" fill="url(#g)"/>
  <text class="p" x="248" y="759">1.17x</text>
  <text class="m" x="1016" y="756">0.018 / 0.021</text>

  <!-- dicts 1.13x -->
  <text class="n" x="64" y="839">dicts</text>
  <rect class="t" x="230" y="812" width="590" height="34" rx="8"/>
  <rect x="230" y="812" width="256" height="34" rx="8" fill="url(#g)"/>
  <text class="p" x="248" y="840">1.13x</text>
  <text class="m" x="1016" y="837">0.110 / 0.124</text>

  <!-- all 1.08x -->
  <text class="n" x="64" y="920">all</text>
  <rect class="t" x="230" y="893" width="590" height="34" rx="8"/>
  <rect x="230" y="893" width="245" height="34" rx="8" fill="url(#g)"/>
  <text class="p" x="248" y="921">1.08x</text>
  <text class="m" x="1016" y="918">0.748 / 0.808</text>

  <!-- recursion 1.07x -->
  <text class="n" x="64" y="1001">recursion</text>
  <rect class="t" x="230" y="974" width="590" height="34" rx="8"/>
  <rect x="230" y="974" width="243" height="34" rx="8" fill="url(#g)"/>
  <text class="p" x="248" y="1002">1.07x</text>
  <text class="m" x="1016" y="999">0.505 / 0.540</text>

  <!-- the 1.00x line and the axis -->
  <line x1="457" y1="395" x2="457" y2="1025" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="7 6"/>
  <text class="a" x="457" y="1046">1.0x</text>
  <text class="a" x="570" y="1046">1.5x</text>
  <text class="a" x="684" y="1046">2.0x</text>
  <text class="a" x="797" y="1046">2.5x</text>
  <text x="457" y="1074" font-size="18" fill="#94a3b8" text-anchor="middle">CPython</text>

  <!-- footer -->
  <line x1="64" y1="1102" x2="1016" y2="1102" stroke="#1f2937"/>
  <text x="64" y="1136" font-size="21" fill="#94a3b8">Each bar is CPython's time divided by Tiger's, both measured in process</text>
  <text x="64" y="1166" font-size="21" fill="#94a3b8">on both sides, with each program's own compile removed from the timing.</text>
  <text x="64" y="1200" font-size="19" fill="#64748b">Best of twelve runs each side; CPython 3.14, Windows, 64-bit.</text>
  <text x="64" y="1226" font-size="19" fill="#64748b">recursion (1.07x) and all (1.08x) sit within the host's jitter of parity.</text>
  <text x="64" y="1262" font-size="20" fill="#4fdca3">github.com/pattygcoding/Tiger-Programming-Language</text>
  <text x="64" y="1292" font-size="19" fill="#94a3b8">Tiger: a dynamically typed language written in Rust</text>
</svg>
