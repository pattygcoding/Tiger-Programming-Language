name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
      - name: Formatting
        run: cargo fmt --check
      - name: Build
        run: cargo build --release
      # Runs the unit tests, the ported Go suites, the 44 benchmark programs,
      # the 189 documentation examples, the example and portfolio programs, the
      # standalone-build integration tests, and the browser runtime under Node.
      - name: Test
        run: cargo test --release
      - name: Verbose benchmark suite
        run: cargo test -p tiger-conformance --test benchmarks --release -- --nocapture
      - name: Verbose documentation examples
        run: cargo test -p tiger-conformance --test documentation --release -- --nocapture

  wasm:
    name: Wasm builds, closure guard, and size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown,wasm32-wasip1
      - name: Browser build
        run: cargo build -p tiger-wasm --release --target wasm32-unknown-unknown
      - name: WASI builds
        run: |
          cargo build -p tiger-evaluator --target wasm32-wasip1
          cargo build -p tiger-wasi --release --target wasm32-wasip1
      - name: Guard the browser closure
        shell: bash
        run: |
          if cargo tree -p tiger-evaluator --target wasm32-unknown-unknown | grep -qE 'regex|memchr|aho-corasick'; then
            echo "::error::the browser closure gained a crate the size guardrails forbid; see AGENTS.md"
            exit 1
          fi
          if ! cargo tree -p tiger-evaluator --target wasm32-wasip1 | grep -q 'regex'; then
            echo "::error::WASI lost the regex module; see AGENTS.md"
            exit 1
          fi
      - name: Guard the Wasm size ceiling
        shell: bash
        run: |
          artifact=target/wasm32-unknown-unknown/release/tiger_wasm.wasm
          size=$(stat -c %s "$artifact")
          # A ceiling on a runaway rather than a target to tune against: it is here so
          # that a dependency which drags in something large is caught in CI instead of
          # in the download. The build is about a quarter of it today.
          budget=2500000
          echo "tiger.wasm is $size bytes (ceiling $budget)"
          if [ "$size" -gt "$budget" ]; then
            echo "::error::tiger.wasm passed the size ceiling; see AGENTS.md (Wasm size guardrails)"
            exit 1
          fi
      # Boots the playground the way a browser does: builds the runtime, serves
      # it, fetches the artifacts over HTTP, and runs a program that reads input.
      - name: Boot the served playground
        run: |
          cargo build -p tiger-web --release
          node crates/tiger-web/tests/startup.mjs
