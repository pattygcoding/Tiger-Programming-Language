name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        go: ["1.22.x", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      # Runs the unit tests, documentation examples, benchmark regression
      # programs, standalone-build integration tests, and the Wasm guard.
      - name: Test (unit, docs, benchmarks, compiler)
        run: go test ./... -count=1

  quality:
    name: Formatting and verbose suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Check gofmt
        shell: bash
        run: |
          unformatted=$(find ./cmd ./pkg ./benchmarks ./docs -name '*.go' -print0 | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: Benchmark regression suite
        run: go test ./benchmarks -count=1 -v
      - name: Documentation examples
        run: go test ./docs -count=1 -v

  wasm:
    name: Wasm builds and size guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Browser build
        run: GOOS=js GOARCH=wasm CGO_ENABLED=0 go build ./...
      - name: WASI build
        run: GOOS=wasip1 GOARCH=wasm CGO_ENABLED=0 go build ./...
      - name: Guard against browser-build bloat
        run: go test ./pkg/wasmcheck -count=1 -v
      - name: Build browser artifact
        run: |
          GOOS=js GOARCH=wasm CGO_ENABLED=0 go build \
            -trimpath -buildvcs=false \
            -ldflags="-s -w -buildid=" \
            -o /tmp/tiger.wasm ./cmd/wasm
          stat -c '%s bytes  /tmp/tiger.wasm' /tmp/tiger.wasm
      - name: Enforce Wasm size budget
        shell: bash
        run: |
          size=$(stat -c %s /tmp/tiger.wasm)
          budget=3300000
          echo "tiger.wasm is $size bytes (budget $budget)"
          if [ "$size" -gt "$budget" ]; then
            echo "::error::tiger.wasm grew past the size budget; see AGENTS.md (Wasm size guardrails)"
            exit 1
          fi